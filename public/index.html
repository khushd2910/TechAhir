<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live auctions</title>
<style>
  :root {
    --paper: #eef1f5; --card: #ffffff; --ink: #14213d; --muted: #5d6b82; --line: #d5dbe5;
    --bid: #2447f5; --bid-ink: #ffffff; --hot: #d97706; --ok: #0f8f6f; --done: #8792a6;
    --flash: #dff5ec; --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0e1524; --card: #16203a; --ink: #e8edf8; --muted: #93a0ba; --line: #28345a;
      --bid: #6d8bff; --bid-ink: #0b1226; --hot: #f5a524; --ok: #35c9a1; --done: #6b7691; --flash: #14403a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--bid); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }

  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: baseline; padding: 20px clamp(16px, 4vw, 40px) 8px; }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: -0.02em; }
  #stats { color: var(--muted); font-size: .95rem; }
  #stats b { color: var(--ink); }

  .bar { display: flex; flex-wrap: wrap; gap: 10px; padding: 8px clamp(16px, 4vw, 40px) 16px; }
  .bar input, .bar select { padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
  .bar input { flex: 1 1 200px; max-width: 320px; }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; padding: 0 clamp(16px, 4vw, 40px) 60px; align-items: start; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }

  .card { position: relative; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 14px 18px; cursor: pointer; overflow: hidden; transition: border-color .15s; }
  .card:hover { border-color: var(--bid); }
  .card[aria-pressed="true"] { border-color: var(--bid); box-shadow: 0 0 0 2px var(--bid); }
  .card .title { font-weight: 600; margin: 0 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .price { font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .meta { color: var(--muted); font-size: .9rem; margin-top: 6px; min-height: 1.3em; }
  .clock { margin-top: 12px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; }
  .clock .t { font-size: 1.15rem; }
  .track { position: absolute; left: 0; bottom: 0; height: 5px; background: var(--bid); transition: width .25s linear; }
  .card.urgent { border-color: var(--hot); }
  .card.urgent .clock .t { color: var(--hot); }
  .card.urgent .track { background: var(--hot); }
  .card.urgent .t { animation: pulse 1s ease-in-out infinite; }
  .card.closed { opacity: .7; }
  .card.closed .track { display: none; }
  .card.closed .clock .t { color: var(--done); }
  .flash { animation: flash .6s ease-out; }
  .ext { color: var(--ok); font-weight: 700; font-size: .9rem; }
  @keyframes flash { from { background: var(--flash); } to { background: var(--card); } }
  @keyframes pulse { 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { .flash, .urgent .t { animation: none; } .track { transition: none; } }

  aside { position: sticky; top: 16px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  aside h2 { margin: 0 0 4px; font-size: 1.15rem; }
  aside .price { font-size: 2.6rem; margin: 10px 0 4px; }
  .empty { color: var(--muted); }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  .row input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
  .primary { background: var(--bid); color: var(--bid-ink); border: 0; border-radius: 10px; padding: 11px 18px; font-weight: 700; cursor: pointer; }
  .primary:disabled { opacity: .5; cursor: not-allowed; }
  .chips { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  .chip:hover { border-color: var(--bid); }
  #msg { min-height: 1.5em; margin-top: 10px; font-weight: 600; }
  #msg.err { color: #c2410c; } #msg.good { color: var(--ok); }
  #recent { list-style: none; padding: 0; margin: 14px 0 0; border-top: 1px solid var(--line); }
  #recent li { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: .95rem; }
  .result { margin-top: 12px; padding: 12px; border-radius: 10px; background: var(--flash); font-weight: 700; }

  footer { padding: 0 clamp(16px, 4vw, 40px) 40px; color: var(--muted); font-size: .9rem; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  footer button { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }

  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; }
    aside { position: fixed; left: 8px; right: 8px; bottom: 8px; top: auto; z-index: 5; max-height: 70vh; overflow: auto; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
    aside.hidden { display: none; }
    #grid { padding-bottom: 40vh; }
  }
</style>
</head>
<body>
<header>
  <h1>Live auctions</h1>
  <div id="stats" class="num">Loading…</div>
</header>
<div class="bar">
  <input id="q" type="search" placeholder="Search by name" aria-label="Search auctions">
  <select id="sort" aria-label="Sort auctions">
    <option value="ending">Ending soonest</option>
    <option value="hot">Most bids</option>
    <option value="price">Highest price</option>
  </select>
  <select id="status" aria-label="Show">
    <option value="open">Open</option>
    <option value="closed">Closed</option>
  </select>
</div>

<main>
  <section id="grid" aria-live="off"></section>
  <aside id="panel" class="hidden" aria-label="Place a bid">
    <div class="empty">Select an auction to bid.</div>
  </aside>
</main>

<footer>
  <span>Demo data:</span>
  <button id="seed">Add 2,000 auctions</button>
  <span id="seedmsg"></span>
</footer>

<script>
const $ = (s) => document.querySelector(s);
const fmt = (n) => Number(n).toLocaleString();
let offset = 0;               // server clock minus local clock
let es = null;
let selected = null;
const cards = new Map();      // id -> { el, s }
let totalLen = new Map();     // id -> original duration (for the progress bar)

function clock(ms) {
  if (ms <= 0) return '0:00';
  const s = Math.ceil(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}` : `${m}:${String(r).padStart(2, '0')}`;
}
const minNext = (s) => (s.bids === 0 ? s.price : s.price + s.minIncrement);
const remaining = (s) => s.endsAt - (Date.now() + offset);

// ---------- lobby ----------
async function loadList() {
  const p = new URLSearchParams({ status: $('#status').value, sort: $('#sort').value, q: $('#q').value, limit: 24 });
  const r = await fetch('/api/auctions?' + p);
  const data = await r.json();
  offset = data.now - Date.now();
  $('#stats').innerHTML = `<b class="num">${fmt(data.counts.open)}</b> open, <b class="num">${fmt(data.counts.closed)}</b> closed, showing ${data.items.length}`;
  const grid = $('#grid');
  grid.replaceChildren();
  cards.clear();
  for (const s of data.items) {
    totalLen.set(s.id, Math.max(totalLen.get(s.id) || 0, remaining(s)));
    const el = document.createElement('button');
    el.className = 'card';
    el.type = 'button';
    el.addEventListener('click', () => select(s.id));
    cards.set(s.id, { el, s });
    paint(s.id);
    grid.appendChild(el);
  }
  if (!data.items.length) grid.innerHTML = '<p class="empty">No auctions match. Add demo auctions below or change the filter.</p>';
  subscribe(data.items.map((s) => s.id).concat(selected && !cards.has(selected) ? [selected] : []));
}

function paint(id, flash) {
  const c = cards.get(id);
  if (!c) return;
  const s = c.s;
  const left = remaining(s);
  const closed = s.status === 'closed';
  c.el.className = 'card' + (closed ? ' closed' : left <= 10_000 ? ' urgent' : '') + (flash ? ' flash' : '');
  c.el.setAttribute('aria-pressed', String(selected === id));
  const total = Math.max(totalLen.get(id) || 1, 1);
  const pct = closed ? 0 : Math.max(0, Math.min(100, (left / total) * 100));
  c.el.innerHTML = `
    <p class="title">${esc(s.title)}</p>
    <div class="price num">${fmt(s.price)}</div>
    <div class="meta">${closed ? (s.winner ? `Won by ${esc(s.winner.bidder)}` : 'Closed with no bids') : s.leader ? `Leading: ${esc(s.leader)}` : 'No bids yet'}</div>
    <div class="clock"><span class="t num">${closed ? 'Closed' : clock(left)}</span><span class="meta num">${fmt(s.bids)} bids</span></div>
    <div class="track" style="width:${pct}%"></div>`;
}
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// One connection follows every visible auction.
function subscribe(ids) {
  if (es) es.close();
  if (!ids.length) return;
  es = new EventSource('/api/stream?ids=' + encodeURIComponent(ids.join(',')));
  es.addEventListener('u', (e) => onUpdate(JSON.parse(e.data)));
}

function onUpdate(s) {
  offset = s.now - Date.now();
  const c = cards.get(s.id);
  if (c) {
    const grew = s.endsAt > c.s.endsAt && c.s.endsAt;
    if (grew) totalLen.set(s.id, Math.max(totalLen.get(s.id) || 0, s.endsAt - (Date.now() + offset)));
    const changed = s.price !== c.s.price;
    c.s = s;
    paint(s.id, changed);
  }
  if (selected === s.id) renderPanel(s);
}

// tick countdowns locally; no network needed
setInterval(() => { for (const id of cards.keys()) paint(id); if (selected && cards.has(selected)) renderPanel(cards.get(selected).s, true); }, 1000);

// ---------- bid panel ----------
let panelState = { id: null };
async function select(id) {
  selected = id;
  for (const k of cards.keys()) paint(k);
  $('#panel').classList.remove('hidden');
  const s = cards.get(id).s;
  panelState = { id, recent: [] };
  renderPanel(s);
  try {
    const r = await fetch(`/api/auctions/${id}/bids`);
    panelState.recent = await r.json();
    renderPanel(cards.get(id).s);
  } catch {}
}

function renderPanel(s, tickOnly) {
  const p = $('#panel');
  if (!tickOnly || !$('#amount')) {
    const keepName = $('#bidder') ? $('#bidder').value : localStorage.getItem('bidder') || '';
    const keepAmt = $('#amount') && $('#amount').dataset.id === s.id ? $('#amount').value : '';
    const closed = s.status === 'closed';
    p.innerHTML = `
      <h2>${esc(s.title)}</h2>
      <div class="meta" id="pmeta"></div>
      <div class="price num" id="pprice"></div>
      <div class="meta" id="pleader"></div>
      ${closed ? `<div class="result">${s.winner ? `${esc(s.winner.bidder)} won at ${fmt(s.winner.amount)}` : 'Closed with no bids'}</div>` : `
      <div class="row"><input id="bidder" placeholder="Your name" maxlength="40" aria-label="Your name" value="${esc(keepName)}"></div>
      <div class="row">
        <input id="amount" type="number" inputmode="numeric" min="1" step="1" aria-label="Your bid" data-id="${s.id}" value="${esc(keepAmt)}">
        <button class="primary" id="bidbtn">Place bid</button>
      </div>
      <div class="chips" id="chips"></div>`}
      <div id="msg" role="status"></div>
      <ul id="recent" aria-label="Recent bids"></ul>`;
    if (!closed) {
      $('#bidbtn').onclick = () => placeBid(s.id);
      $('#amount').addEventListener('keydown', (e) => { if (e.key === 'Enter') placeBid(s.id); });
      if (!keepAmt) $('#amount').value = minNext(s);
    }
  }
  $('#pprice').textContent = fmt(s.price);
  $('#pmeta').textContent = s.status === 'closed' ? 'Closed' : `Ends in ${clock(remaining(s))}`;
  $('#pleader').textContent = s.leader ? `Leading: ${s.leader}` : `Starting price ${fmt(s.startPrice)}`;
  if (s.status === 'open' && $('#chips')) {
    const base = minNext(s);
    $('#chips').innerHTML = [0, 1, 5, 20].map((k) => `<button class="chip num" data-v="${base + s.minIncrement * k}">${fmt(base + s.minIncrement * k)}</button>`).join('');
    $('#chips').querySelectorAll('button').forEach((b) => (b.onclick = () => ($('#amount').value = b.dataset.v)));
    if (!tickOnly && Number($('#amount').value) < base) $('#amount').value = base;
  }
  $('#recent').innerHTML = (panelState.recent || []).slice(0, 8).map((b) => `<li><span>${esc(b.bidder)}</span><span class="num">${fmt(b.amount)}</span></li>`).join('');
}

async function placeBid(id) {
  const bidder = $('#bidder').value.trim();
  const amount = Number($('#amount').value);
  const msg = $('#msg');
  if (!bidder) { msg.className = 'err'; msg.textContent = 'Enter your name to bid.'; return; }
  if (!Number.isInteger(amount) || amount <= 0) { msg.className = 'err'; msg.textContent = 'Enter a whole number.'; return; }
  localStorage.setItem('bidder', bidder);
  $('#bidbtn').disabled = true;
  const key = crypto.randomUUID(); // a retry of THIS click can never count twice
  let res;
  for (let attempt = 0; attempt < 3 && !res; attempt++) {
    try {
      res = await fetch(`/api/auctions/${id}/bids`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Idempotency-Key': key },
        body: JSON.stringify({ bidder, amount })
      });
    } catch { await new Promise((r) => setTimeout(r, 400)); }
  }
  $('#bidbtn') && ($('#bidbtn').disabled = false);
  if (!res) { msg.className = 'err'; msg.textContent = 'Network problem. Check your connection and try again.'; return; }
  const body = await res.json();
  if (body.auction) onUpdate({ ...body.auction, now: Date.now() + offset });
  const m = $('#msg');
  if (body.accepted) {
    m.className = 'good';
    m.textContent = body.extended ? 'Bid placed. The auction was extended.' : 'Bid placed. You are leading.';
    fetch(`/api/auctions/${id}/bids`).then((r) => r.json()).then((rec) => { panelState.recent = rec; renderPanel(cards.get(id).s, true); });
  } else {
    m.className = 'err';
    m.textContent = {
      TOO_LOW: `Too low. The next bid must be at least ${fmt(body.needed)}.`,
      CLOSED: 'This auction has closed.',
      RATE_LIMITED: 'Too many bids. Wait a second and try again.'
    }[body.reason || body.error] || 'Bid not accepted.';
  }
}

// ---------- controls ----------
let debounce;
$('#q').addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(loadList, 250); });
$('#sort').addEventListener('change', loadList);
$('#status').addEventListener('change', loadList);
$('#seed').addEventListener('click', async () => {
  $('#seedmsg').textContent = 'Creating…';
  const r = await fetch('/api/admin/seed', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ count: 2000, prefix: 'demo' + Date.now().toString(36), minDurationMs: 60000, maxDurationMs: 600000 }) });
  const b = await r.json();
  $('#seedmsg').textContent = r.ok ? `Created ${fmt(b.created)} auctions in ${b.ms}ms` : (b.error || 'Failed. An admin key may be required.');
  loadList();
});
setInterval(() => { if (document.visibilityState === 'visible') loadList(); }, 30000);
loadList();
</script>
</body>
</html>
